services:
  # Tidak ada service "db" tersendiri - backend Docker sengaja disambungkan
  # ke MySQL yang sama dengan yang dipakai backend Laragon (host.docker.internal
  # menunjuk ke MySQL di mesin host), supaya cuma ada SATU sumber data dan
  # tidak ada lagi data ganda/dummy yang beda dari data asli.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finstart_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-finstart_db}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-8}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-5}
      AUTH_LOGIN_LOCK_MINUTES: ${AUTH_LOGIN_LOCK_MINUTES:-1}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-}
      DEMO_USER_NAME: ${DEMO_USER_NAME:-}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      # AI Finstart lewat Ollama yang jalan di komputer/server host (di luar
      # Docker) - "host.docker.internal" adalah alamat khusus supaya container
      # ini bisa menjangkau Ollama di host. Ganti OLLAMA_BASE_URL kalau Ollama
      # dijalankan di tempat lain (server terpisah, dsb).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-4001}:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4001/api}
    container_name: finstart_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 80
    ports:
      - "80:80"
